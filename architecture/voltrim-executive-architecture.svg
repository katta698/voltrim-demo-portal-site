  <path d="M1354 639 H1265" fill="none" stroke="#147EBA" stroke-width="2.4" marker-end="url(#arrowBlue)"/><circle cx="1310" cy="620" r="12" fill="#147EBA"/><text x="1310" y="624" text-anchor="middle" class="step">6</text><text x="1310" y="662" text-anchor="middle" class="flow">ticket evidence</text>

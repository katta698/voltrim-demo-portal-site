<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">VolTrim executive reference architecture</title>
  <desc id="desc">Enterprise users access VolTrim through Entra ID and a web portal. A governance account reads organization inventory, financial and audit sources, validates current EC2 state in workload accounts, and integrates with ServiceNow. Automated remediation is shown as a future gated path.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="7.3" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6 L10 5 L0 9.4 Z" fill="#147EBA"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="7.3" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6 L10 5 L0 9.4 Z" fill="#ED7100"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="7.3" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6 L10 5 L0 9.4 Z" fill="#8B5CF6"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#172033}.subtitle{font:400 14px Arial,sans-serif;fill:#5F6B7A}.zone-title{font:700 15px Arial,sans-serif;fill:#172033}.zone-sub{font:400 11px Arial,sans-serif;fill:#667085}.node-title{font:700 12px Arial,sans-serif;fill:#172033}.node-sub{font:400 10px Arial,sans-serif;fill:#667085}.flow{font:700 10px Arial,sans-serif;fill:#344054}.step{font:700 11px Arial,sans-serif;fill:#fff}.legend{font:600 10px Arial,sans-serif;fill:#344054}.small{font:400 9px Arial,sans-serif;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="920" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1600" height="74" fill="#232F3E"/>
  <text x="38" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">VolTrim - Enterprise Storage Governance</text>
  <text x="38" y="61" font-family="Arial,sans-serif" font-size="11" fill="#D5DBDB">Executive reference architecture | Read-only first, evidence before automation | Version 1.0 - 2026-07-18</text>
  <rect x="1329" y="18" width="235" height="38" rx="19" fill="#314155" stroke="#FF9900"/>
  <text x="1446" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFB84D">REFERENCE TARGET STATE</text>

  <!-- Enterprise access -->
  <g transform="translate(-14 0)">
    <rect x="32" y="104" width="230" height="672" rx="16" fill="#fff" stroke="#B8C4D1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="32" y="104" width="230" height="42" rx="16" fill="#E8F2FA"/><rect x="32" y="130" width="230" height="16" fill="#E8F2FA"/>
    <text x="50" y="130" class="zone-title">Enterprise users</text>
    <text x="50" y="165" class="zone-sub">Role-scoped experience</text>
    <g transform="translate(50 190)">
      <rect width="194" height="48" rx="8" fill="#F8FAFC" stroke="#D0D5DD"/><text x="14" y="21" class="node-title">Leadership + Finance</text><text x="14" y="36" class="node-sub">Coverage, value, risk</text>
      <rect y="62" width="194" height="48" rx="8" fill="#F8FAFC" stroke="#D0D5DD"/><text x="14" y="83" class="node-title">FinOps + Application owners</text><text x="14" y="98" class="node-sub">Findings, cost, response</text>
      <rect y="124" width="194" height="48" rx="8" fill="#F8FAFC" stroke="#D0D5DD"/><text x="14" y="145" class="node-title">Operations + Platform</text><text x="14" y="160" class="node-sub">Health, workflow, recovery</text>
      <rect y="186" width="194" height="48" rx="8" fill="#F8FAFC" stroke="#D0D5DD"/><text x="14" y="207" class="node-title">Security + Audit</text><text x="14" y="222" class="node-sub">Identity and evidence</text>
    </g>
    <rect x="50" y="465" width="194" height="96" rx="10" fill="#FFF7E8" stroke="#ED7100"/>
    <text x="147" y="487" text-anchor="middle" class="node-title">Microsoft Entra ID</text>
    <text x="147" y="504" text-anchor="middle" class="node-sub">MFA + Conditional Access</text>
    <text x="147" y="519" text-anchor="middle" class="node-sub">Reader / Operator / Approver / Admin</text>
    <text x="147" y="543" text-anchor="middle" class="small">Enterprise identity service</text>
    <rect x="50" y="590" width="194" height="152" rx="10" fill="#F0F6FF" stroke="#147EBA" stroke-dasharray="6 4"/>
    <text x="147" y="614" text-anchor="middle" class="node-title">Enterprise standards</text>
    <text x="66" y="638" class="node-sub">• DNS + certificates</text><text x="66" y="658" class="node-sub">• WAF / proxy / firewall</text><text x="66" y="678" class="node-sub">• VPC + private endpoints</text><text x="66" y="698" class="node-sub">• KMS + retention policy</text><text x="66" y="718" class="node-sub">• Access reviews + on-call</text>
  </g>

  <!-- Governance account -->
  <g transform="translate(-16 0)">
    <rect x="300" y="104" width="636" height="672" rx="16" fill="#fff" stroke="#ED7100" stroke-width="2" filter="url(#shadow)"/>
    <rect x="300" y="104" width="636" height="42" rx="16" fill="#FFF1E5"/><rect x="300" y="130" width="636" height="16" fill="#FFF1E5"/>
    <text x="320" y="130" class="zone-title">VolTrim governance account</text><text x="916" y="130" text-anchor="end" class="zone-sub">Dedicated control plane - Terraform deployed</text>

    <g transform="translate(330 174)">
      <rect width="165" height="108" rx="11" fill="#F8FAFC" stroke="#AAB7C4"/><image x="16" y="15" width="42" height="42" href="aws-icons/Arch_Amazon-Route-53_48.svg"/><image x="66" y="15" width="42" height="42" href="aws-icons/Arch_Amazon-CloudFront_48.svg"/><text x="82" y="76" text-anchor="middle" class="node-title">Portal delivery</text><text x="82" y="93" text-anchor="middle" class="node-sub">Route 53 + CloudFront</text>
      <rect x="195" width="165" height="108" rx="11" fill="#F8FAFC" stroke="#AAB7C4"/><image x="256" y="13" width="44" height="44" href="aws-icons/Arch_Amazon-API-Gateway_48.svg"/><text x="277" y="76" text-anchor="middle" class="node-title">Authorized API</text><text x="277" y="93" text-anchor="middle" class="node-sub">JWT + throttling</text>
      <rect x="390" width="200" height="108" rx="11" fill="#FFF7E8" stroke="#ED7100"/><image x="411" y="13" width="44" height="44" href="aws-icons/Arch_AWS-Lambda_48.svg"/><text x="470" y="31" class="node-title">VolTrim services</text><text x="470" y="48" class="node-sub">Inventory + governed APIs</text><text x="490" y="76" text-anchor="middle" class="node-sub">Deterministic facts before AI</text><text x="490" y="93" text-anchor="middle" class="node-sub">Read-only enterprise baseline</text>
    </g>

    <path d="M495 228 H525" stroke="#ED7100" stroke-width="2" marker-end="url(#arrowOrange)"/><path d="M690 228 H720" stroke="#ED7100" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <g transform="translate(330 320)">
      <rect width="280" height="122" rx="11" fill="#F8FAFC" stroke="#AAB7C4"/><image x="18" y="18" width="44" height="44" href="aws-icons/Arch_Amazon-DynamoDB_48.svg"/><text x="78" y="37" class="node-title">Promoted inventory + workflow</text><text x="78" y="55" class="node-sub">DynamoDB - versioned snapshot pointer</text><text x="18" y="88" class="node-sub">One snapshot ID serves dashboard and Ask VolTrim</text><text x="18" y="105" class="node-sub">Incomplete account/Region coverage fails closed</text>
      <rect x="310" width="280" height="122" rx="11" fill="#F8FAFC" stroke="#AAB7C4"/><image x="328" y="18" width="44" height="44" href="aws-icons/Arch_Amazon-Bedrock_48.svg"/><text x="388" y="37" class="node-title">Ask VolTrim explanation</text><text x="388" y="55" class="node-sub">Amazon Bedrock - governed fact bundle</text><text x="328" y="88" class="node-sub">Citations + freshness + limitations required</text><text x="328" y="105" class="node-sub">No approval or mutation authority</text>
    </g>
    <path d="M610 381 H640" stroke="#147EBA" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <g transform="translate(330 482)">
      <rect width="180" height="108" rx="11" fill="#F8FAFC" stroke="#AAB7C4"/><image x="18" y="15" width="42" height="42" href="aws-icons/Arch_Amazon-CloudWatch_48.svg"/><text x="74" y="32" class="node-title">Operations</text><text x="74" y="49" class="node-sub">CloudWatch</text><text x="18" y="78" class="node-sub">Logs, metrics, alarms</text><text x="18" y="94" class="node-sub">Source freshness + failures</text>
      <rect x="205" width="180" height="108" rx="11" fill="#F8FAFC" stroke="#AAB7C4"/><image x="223" y="15" width="42" height="42" href="aws-icons/Arch_AWS-Key-Management-Service_48.svg"/><text x="279" y="32" class="node-title">Protection</text><text x="279" y="49" class="node-sub">AWS KMS</text><text x="223" y="78" class="node-sub">Encryption boundaries</text><text x="223" y="94" class="node-sub">Approved key policies</text>
      <rect x="410" width="180" height="108" rx="11" fill="#F7F2FF" stroke="#8B5CF6" stroke-dasharray="7 4"/><image x="428" y="15" width="42" height="42" href="aws-icons/Arch_AWS-Step-Functions_48.svg"/><text x="478" y="32" class="node-title">Future remediation</text><text x="478" y="49" class="node-sub">Step Functions</text><text x="428" y="78" class="node-sub">Approval + snapshot</text><text x="428" y="94" class="node-sub">Gated, disabled initially</text>
    </g>
    <rect x="330" y="628" width="590" height="112" rx="11" fill="#F9FAFB" stroke="#98A2B3"/>
    <text x="350" y="653" class="node-title">Control principle</text>
    <text x="350" y="677" class="node-sub">Discovery is not deletion authority. Read-only inventory is implemented first.</text>
    <text x="350" y="698" class="node-sub">Future mutation requires enrollment, ownership, grace period, exemption check, approval, live EC2 revalidation,</text>
    <text x="350" y="717" class="node-sub">completed recovery snapshot, immutable intent, CloudTrail correlation, alarms, restore tests and emergency stop.</text>
  </g>

  <!-- Shared data account -->
  <rect x="1010" y="104" width="264" height="672" rx="16" fill="#fff" stroke="#147EBA" stroke-width="2" stroke-dasharray="8 5" filter="url(#shadow)"/>
  <rect x="1010" y="104" width="264" height="42" rx="16" fill="#E8F2FA"/><rect x="1010" y="130" width="264" height="16" fill="#E8F2FA"/>
  <text x="1030" y="130" class="zone-title">Existing enterprise data services</text>
  <text x="1030" y="165" class="zone-sub">Central billing / security / platform account</text>
  <g transform="translate(1024 190)">
    <rect width="236" height="98" rx="10" fill="#F8FAFC" stroke="#AAB7C4"/><image x="16" y="15" width="42" height="42" href="aws-icons/Arch_AWS-Config_48.svg"/><text x="70" y="33" class="node-title">AWS Config aggregator</text><text x="70" y="50" class="node-sub">Organization inventory history</text><text x="16" y="80" class="node-sub">Coverage evidence + rule results</text>
    <rect y="116" width="236" height="98" rx="10" fill="#F8FAFC" stroke="#AAB7C4"/><image x="16" y="131" width="42" height="42" href="aws-icons/Arch_AWS-CloudTrail_48.svg"/><text x="70" y="149" class="node-title">Organization CloudTrail</text><text x="70" y="166" class="node-sub">Independent API attribution</text><text x="16" y="196" class="node-sub">Retained log archive or CloudTrail Lake</text>
    <rect y="232" width="236" height="122" rx="10" fill="#F8FAFC" stroke="#AAB7C4"/><image x="17" y="247" width="40" height="40" href="aws-icons/Arch_AWS-Cost-and-Usage-Report_48.svg"/><image x="71" y="247" width="40" height="40" href="aws-icons/Arch_Amazon-Simple-Storage-Service_48.svg"/><image x="125" y="247" width="40" height="40" href="aws-icons/Arch_AWS-Glue_48.svg"/><image x="179" y="247" width="40" height="40" href="aws-icons/Arch_Amazon-Athena_48.svg"/><text x="118" y="310" text-anchor="middle" class="node-title">CUR / FOCUS analytics</text><text x="118" y="327" text-anchor="middle" class="node-sub">S3 + Glue + Athena</text><text x="118" y="344" text-anchor="middle" class="node-sub">Estimated vs invoice-verified value</text>
    <rect y="372" width="236" height="96" rx="10" fill="#F8FAFC" stroke="#AAB7C4"/><image x="16" y="386" width="42" height="42" href="aws-icons/Arch_Amazon-Simple-Storage-Service_48.svg"/><text x="70" y="404" class="node-title">VolTrim audit ledger</text><text x="70" y="421" class="node-sub">Schema-qualified evidence</text><text x="16" y="449" class="node-sub">Object Lock / retention per policy</text>
    <rect y="484" width="236" height="88" rx="10" fill="#F8FAFC" stroke="#AAB7C4"/><image x="16" y="498" width="42" height="42" href="aws-icons/Arch_Amazon-CloudWatch_48.svg"/><text x="70" y="516" class="node-title">AWS Compute Optimizer</text><text x="70" y="533" class="small">Rightsizing and gp3 recommendations</text><text x="16" y="560" class="node-sub">Read, never recalculated by VolTrim</text>
  </g>

  <!-- Workloads and ITSM -->
  <g transform="translate(6 0)">
    <rect x="1340" y="104" width="218" height="420" rx="16" fill="#fff" stroke="#147EBA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1340" y="104" width="218" height="42" rx="16" fill="#E8F2FA"/><rect x="1340" y="130" width="218" height="16" fill="#E8F2FA"/>
    <text x="1360" y="130" class="zone-title">Workload accounts (1...N)</text>
    <text x="1360" y="166" class="zone-sub">Pilot: one non-production account</text>
    <rect x="1354" y="190" width="190" height="102" rx="10" fill="#F8FAFC" stroke="#AAB7C4"/><image x="1371" y="207" width="42" height="42" href="aws-icons/Arch_AWS-Identity-and-Access-Management_48.svg"/><text x="1424" y="225" class="node-title">Cross-account IAM</text><text x="1424" y="242" class="node-sub">Read-only first</text><text x="1371" y="273" class="node-sub">STS assume role + SCP boundaries</text>
    <rect x="1354" y="312" width="190" height="166" rx="10" fill="#F8FAFC" stroke="#AAB7C4"/><image x="1373" y="331" width="42" height="42" href="aws-icons/Arch_Amazon-EC2_48.svg"/><image x="1428" y="331" width="42" height="42" href="aws-icons/Arch_Amazon-Elastic-Block-Store_48.svg"/><text x="1449" y="397" text-anchor="middle" class="node-title">EC2 + EBS</text><text x="1371" y="418" class="node-sub">DescribeVolumes validates</text><text x="1371" y="433" class="node-sub">current state</text><text x="1371" y="453" class="node-sub">Future gated path:</text><text x="1371" y="468" class="node-sub">snapshot - verify - delete</text>

    <rect x="1340" y="558" width="218" height="218" rx="16" fill="#fff" stroke="#697586" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1360" y="586" class="zone-title">Enterprise workflow</text>
    <rect x="1354" y="608" width="190" height="62" rx="9" fill="#F8FAFC" stroke="#AAB7C4"/><text x="1449" y="633" text-anchor="middle" class="node-title">ServiceNow</text><text x="1449" y="651" text-anchor="middle" class="node-sub">Owner action + approval evidence</text>
    <rect x="1354" y="687" width="190" height="62" rx="9" fill="#F8FAFC" stroke="#AAB7C4"/><text x="1449" y="712" text-anchor="middle" class="node-title">Teams / Slack / Email</text><text x="1449" y="730" text-anchor="middle" class="node-sub">Approved notification channels</text>
  </g>

  <!-- Cross-zone flows.
       Long routes 5 and 7 run on the diagram perimeter (top band, bottom band and
       the right-hand lane at x=1580) so they never cross a zone interior or a
       numbered badge. Short hops 1-4 and 6 live in the inter-zone gaps, which are
       sized to hold a badge and its label without touching either border. -->
  <path d="M248 513 H284" stroke="#ED7100" stroke-width="2" marker-end="url(#arrowOrange)"/><circle cx="266" cy="493" r="12" fill="#ED7100"/><text x="266" y="497" text-anchor="middle" class="step">1</text><text x="266" y="536" text-anchor="middle" class="flow">SSO</text>

  <path d="M920 245 H1010" stroke="#147EBA" stroke-width="2" marker-end="url(#arrowBlue)"/><circle cx="972" cy="222" r="12" fill="#147EBA"/><text x="972" y="226" text-anchor="middle" class="step">2</text><text x="972" y="270" text-anchor="middle" class="flow">inventory</text>

  <path d="M1274 260 H1346" stroke="#147EBA" stroke-width="2" marker-end="url(#arrowBlue)"/><circle cx="1310" cy="237" r="12" fill="#147EBA"/><text x="1310" y="241" text-anchor="middle" class="step">3</text><text x="1310" y="285" text-anchor="middle" class="flow">live state</text>

  <path d="M1010 419 H920" stroke="#147EBA" stroke-width="2" marker-end="url(#arrowBlue)"/><circle cx="972" cy="396" r="12" fill="#147EBA"/><text x="972" y="400" text-anchor="middle" class="step">4</text><text x="972" y="444" text-anchor="middle" class="flow">cost + audit</text>

  <path d="M920 700 H952 V790 H1580 V639 H1554" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="1166" y="781" width="86" height="18" rx="5" fill="#F7F8FA"/>
  <circle cx="1140" cy="790" r="12" fill="#ED7100"/><text x="1140" y="794" text-anchor="middle" class="step">5</text><text x="1172" y="794" class="flow">ticket + notify</text>

  <path d="M1360 639 H1266" fill="none" stroke="#147EBA" stroke-width="2" marker-end="url(#arrowBlue)"/><circle cx="1310" cy="616" r="12" fill="#147EBA"/><text x="1310" y="620" text-anchor="middle" class="step">6</text><text x="1310" y="664" text-anchor="middle" class="flow">ticket</text><text x="1310" y="677" text-anchor="middle" class="flow">evidence</text>

  <path d="M904 536 H936 V88 H1580 V420 H1554" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrowPurple)"/>
  <rect x="1196" y="79" width="70" height="18" rx="5" fill="#F7F8FA"/>
  <circle cx="1170" cy="88" r="12" fill="#8B5CF6"/><text x="1170" y="92" text-anchor="middle" class="step">7</text><text x="1202" y="92" class="flow">future path</text>

  <!-- Legend -->
  <g transform="translate(-14 0)">
    <rect x="32" y="806" width="1546" height="84" rx="12" fill="#fff" stroke="#D0D5DD"/>
    <text x="52" y="834" class="zone-title">Legend and deployment responsibility</text>
    <line x1="52" y1="858" x2="98" y2="858" stroke="#147EBA" stroke-width="2" marker-end="url(#arrowBlue)"/><text x="110" y="862" class="legend">Read / evidence flow</text>
    <line x1="280" y1="858" x2="326" y2="858" stroke="#ED7100" stroke-width="2" marker-end="url(#arrowOrange)"/><text x="338" y="862" class="legend">Portal / workflow flow</text>
    <line x1="530" y1="858" x2="576" y2="858" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrowPurple)"/><text x="588" y="862" class="legend">Future gated mutation</text>
    <rect x="790" y="846" width="28" height="22" rx="4" fill="#FFF1E5" stroke="#ED7100"/><text x="828" y="862" class="legend">VolTrim deployed</text>
    <rect x="970" y="846" width="28" height="22" rx="4" fill="#E8F2FA" stroke="#147EBA" stroke-dasharray="5 3"/><text x="1008" y="862" class="legend">Enterprise provided</text>
    <rect x="1180" y="846" width="28" height="22" rx="4" fill="#F7F2FF" stroke="#8B5CF6" stroke-dasharray="5 3"/><text x="1218" y="862" class="legend">Future / gated</text>
    <text x="1558" y="862" text-anchor="end" class="small">AWS Architecture Icons package: 2026-04-30</text>

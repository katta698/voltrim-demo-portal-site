  <path d="M950 245 H990" stroke="#147EBA" stroke-width="2.4" marker-end="url(#arrowBlue)"/><circle cx="970" cy="226" r="12" fill="#147EBA"/><text x="970" y="230" text-anchor="middle" class="step">2</text><text x="970" y="268" text-anchor="middle" class="flow">inventory</text>
  <path d="M1290 260 H1330" stroke="#147EBA" stroke-width="2.4" marker-end="url(#arrowBlue)"/><circle cx="1310" cy="241" r="12" fill="#147EBA"/><text x="1310" y="245" text-anchor="middle" class="step">3</text><text x="1310" y="283" text-anchor="middle" class="flow">live state</text>
